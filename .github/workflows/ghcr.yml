# CLI イメージ(Dockerfile の --target cli。ビルド済み web GUI を同梱し taskaror serve で配信できる)を
# GHCR (GitHub Container Registry) に公開する。バージョンタグ(v*)の push で実行される。
name: GHCR

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 公開は同一 ref で同時に 1 つだけ(実行中の公開は中断しない)
concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build & push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # multi-arch (linux/arm64) ビルドのためのエミュレータと buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 タグから 1.2.3 / 1.2 を生成(latest は flavor の既定 auto で付与される)。
          # workflow_dispatch(ブランチからの手動実行)ではブランチ名タグを付ける
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

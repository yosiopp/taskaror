# GitHub Pages(Jekyll)の設定。site/ 配下が公開ドキュメントのソース。
# デプロイは .github/workflows/pages.yml が行う。
title: taskaror
description: YAML ベースのタスク定義フォーマット TaskSpec のエディタ・ツール群
lang: ja
theme: minima
permalink: pretty

# 先頭見出しをページタイトルとして使い、本文からは取り除く(二重表示を防ぐ)
titles_from_headings:
  strip_title: true

# ヘッダのナビゲーションに載せるページ
header_pages:
  - taskspec.md
  - gui.md
  - cli.md
  - derivation.md
  - lint.md

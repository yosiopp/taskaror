# 除外日(info.holidays)のサンプル。
# 2026 年の日本の祝日を営業日から除外し、1 年間かかる 1 タスクを置く。
# ガントでは祝日の列が土日と同じ網掛けになり、バーは祝日を飛ばして伸びる。
taskspec: '1.0'

info:
  title: 2026年 通年プロジェクト
  holidays:
    - 2026-01-01 # 元日
    - 2026-01-12 # 成人の日
    - 2026-02-11 # 建国記念の日
    - 2026-02-23 # 天皇誕生日
    - 2026-03-20 # 春分の日
    - 2026-04-29 # 昭和の日
    - 2026-05-03 # 憲法記念日(日曜)
    - 2026-05-04 # みどりの日
    - 2026-05-05 # こどもの日
    - 2026-05-06 # 振替休日(憲法記念日分)
    - 2026-07-20 # 海の日
    - 2026-08-11 # 山の日
    - 2026-09-21 # 敬老の日
    - 2026-09-22 # 国民の休日
    - 2026-09-23 # 秋分の日
    - 2026-10-12 # スポーツの日
    - 2026-11-03 # 文化の日
    - 2026-11-23 # 勤労感謝の日

tasks:
  - id: year-round
    title: 通年タスク
    # 1/1 は元日(除外日)のため、導出上の開始は翌営業日 1/2。
    # 1/2〜12/31 は土日と上記の祝日を除いて 244 営業日 = 終了日は 12/31 になる。
    start: 2026-01-01
    estimate: 244d
